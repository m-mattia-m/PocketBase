name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # The PAT, not GITHUB_TOKEN: a release created by GITHUB_TOKEN doesn't fire
    # the release event, so the publish workflow would never start.
    env:
      GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version
        id: version
        run: |
          set -euo pipefail

          PB_VERSION="$(sed -n 's/^ARG PB_VERSION=\([0-9][0-9A-Za-z.\-]*\).*/\1/p' Dockerfile | head -n1)"
          if ! printf '%s' "$PB_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read a major.minor.patch PB_VERSION from the Dockerfile"
            exit 1
          fi

          # 0.40.3 -> 1.40.3
          PB_MAJOR="${PB_VERSION%%.*}"
          VERSION="$((PB_MAJOR + 1)).${PB_VERSION#*.}"

          echo "pb_version=$PB_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PocketBase v$PB_VERSION -> image $VERSION"

      - name: Create release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PB_VERSION: ${{ steps.version.outputs.pb_version }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VERSION already released."
            exit 0
          fi

          printf '%s\n' \
            "Image for [PocketBase v${PB_VERSION}](https://github.com/pocketbase/pocketbase/releases/tag/v${PB_VERSION})." \
            "" \
            '```bash' \
            "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/pocketbase:${VERSION}" \
            '```' > release-notes.md

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md
