name: Build Docker Image

on:
  push:
    branches:
      - main
      - develop
      - 'develop/**'
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: pocketbase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build . --file ./Dockerfile --tag $IMAGE_NAME
