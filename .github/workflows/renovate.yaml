name: Renovate

on:
  schedule:
    # Daily, ~03:00 Europe/Zurich. The runner has to fire often enough for the
    # unscheduled dependencies in renovate.json (PocketBase and our own image
    # tag) to be picked up within a day; everything else is still batched into
    # the Saturday window by the top-level `schedule` there. Daily also makes
    # the runs GitHub delays or drops entirely self-healing.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.15
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Renovate ignores any branch whose last commit has a different
          # author, so this has to stay stable.
          RENOVATE_GIT_AUTHOR: 'm-mattia-m-machine <157844265+m-mattia-m-machine@users.noreply.github.com>'
        with:
          # Needs a PAT. Merges made with GITHUB_TOKEN don't trigger the
          # release workflow.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
