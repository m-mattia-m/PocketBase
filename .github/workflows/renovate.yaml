name: Renovate

on:
  schedule:
    # Saturday 03:00 Europe/Zurich (01:00 UTC in summer, 02:00 UTC in winter).
    # The extra runs cover the DST offset and give Renovate a second pass to
    # merge branches whose checks only went green after the first pass.
    # The actual update window is enforced by "schedule" in renovate.json.
    - cron: '0 1,2,3,4 * * 6'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
      dryRun:
        description: 'Run without creating or merging anything'
        required: false
        default: false
        type: boolean

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.5
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || 'null' }}
          # Manual runs should not have to wait for the Saturday window.
          RENOVATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '{"schedule":["at any time"]}' || '{}' }}
        with:
          # A PAT (repo scope) is required: pushes and merges made with the
          # default GITHUB_TOKEN do not trigger the release workflow.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
