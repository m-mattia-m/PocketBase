name: Renovate

on:
  schedule:
    # Saturday 03:00 Europe/Zurich. Repeated because GitHub delays scheduled
    # runs and sometimes skips them entirely.
    - cron: '0 1,2,3,4 * * 6'
  workflow_dispatch:

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Renovate ignores any branch whose last commit has a different
          # author, so this has to stay stable.
          RENOVATE_GIT_AUTHOR: 'm-mattia-m-machine <157844265+m-mattia-m-machine@users.noreply.github.com>'
        with:
          # Needs a PAT. Merges made with GITHUB_TOKEN don't trigger the
          # release workflow.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
